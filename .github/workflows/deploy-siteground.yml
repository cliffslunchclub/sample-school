name: Build and deploy school sites

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/**"
      - "pb_hooks/**"
      - "pb_migrations/**"
      - "package.json"
      - ".github/workflows/deploy-siteground.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteground-production
  cancel-in-progress: false

jobs:
  package:
    name: Test and package both school sites
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run app regression checks
        run: npm test

      - name: Run TypeScript check
        run: ./frontend/node_modules/.bin/tsc --noEmit -p frontend/tsconfig.app.json

      - name: Prepare versioned site packages
        id: release
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::7}"
          release_id="v${version}-${short_sha}"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

          npm run deploy:prepare -- --target sample --api-url https://clc-schools.pockethost.io --release "$release_id"
          npm run deploy:prepare -- --target chs --api-url https://clc-schools.pockethost.io --release "$release_id"

          (cd ".deploy/sample/$release_id/siteground" && zip -q -r "$GITHUB_WORKSPACE/Sample-School-$release_id.zip" .)
          (cd ".deploy/chs/$release_id/siteground" && zip -q -r "$GITHUB_WORKSPACE/Cherry-Hill-$release_id.zip" .)
          (cd ".deploy/sample/$release_id/pockethost" && zip -q -r "$GITHUB_WORKSPACE/PocketHost-Schools-$release_id.zip" pb_hooks pb_migrations)

      - name: Save versioned ZIPs to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: siteground-${{ github.sha }}
          path: |
            Sample-School-${{ steps.release.outputs.id }}.zip
            Cherry-Hill-${{ steps.release.outputs.id }}.zip
            PocketHost-Schools-${{ steps.release.outputs.id }}.zip
          if-no-files-found: error
          retention-days: 90

  deploy-backend:
    name: Upload and verify shared PocketHost backend
    needs: package
    if: ${{ vars.ENABLE_SITEGROUND_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out verification script
        uses: actions/checkout@v4

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: siteground-${{ github.sha }}
          path: packages

      - name: Unpack backend code
        run: unzip -q "packages/PocketHost-Schools-${{ needs.package.outputs.release_id }}.zip" -d backend

      - name: Configure PocketHost SSH
        env:
          PH_KEY: ${{ secrets.POCKETHOST_SSH_KEY }}
          PH_PASSPHRASE: ${{ secrets.POCKETHOST_SSH_PASSPHRASE }}
          HOST_KEYS: ${{ secrets.POCKETHOST_KNOWN_HOSTS }}
        run: |
          test -n "$PH_KEY" || { echo "Add POCKETHOST_SSH_KEY to GitHub secrets."; exit 1; }
          test -n "$HOST_KEYS" || { echo "Add POCKETHOST_KNOWN_HOSTS using the trusted host entry from your Mac."; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PH_KEY" | tr -d '\r' > ~/.ssh/pockethost
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/pockethost ~/.ssh/known_hosts
          ssh-keygen -F '[ftp.pockethost.io]:2222' -f ~/.ssh/known_hosts > /dev/null || { echo "The trusted PocketHost entry for port 2222 is missing."; exit 1; }
          eval "$(ssh-agent -s)"
          printf '%s\n' "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/ssh-askpass" <<'SH'
          #!/bin/sh
          printf '%s\n' "$KEY_PASSPHRASE"
          SH
          chmod 700 "$RUNNER_TEMP/ssh-askpass"
          export SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          KEY_PASSPHRASE="$PH_PASSPHRASE" ssh-add ~/.ssh/pockethost < /dev/null
          rm "$RUNNER_TEMP/ssh-askpass"

      - name: Upload only backend code to clc-schools
        env:
          PH_USER: ${{ secrets.POCKETHOST_USER || 'cliffscafe41@gmail.com' }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          hooks=Path('backend/pb_hooks')
          # Helpers first, then request hooks, migrations, and the release hook.
          files=sorted(p for p in hooks.glob('*.js') if not p.name.endswith('.pb.js'))
          files+=sorted(p for p in hooks.glob('*.pb.js') if p.name!='release.pb.js')
          files+=sorted(Path('backend/pb_migrations').glob('*.js'))
          files+=[hooks/'release.pb.js']
          with open('backend.sftp','w') as batch:
              for item in files:
                  batch.write(f'put "{item}" "/clc-schools/{item.parent.name}/{item.name}"\n')
          PYCODE
          sftp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/pockethost -P 2222 -b backend.sftp "$PH_USER@ftp.pockethost.io"

      - name: Verify backend release and demo migration before publishing frontends
        env:
          EXPECTED_RELEASE: ${{ needs.package.outputs.release_id }}
        run: python3 scripts/verify-hosted-demo.py

  deploy-sample:
    name: Deploy Sample School
    needs: [package, deploy-backend]
    if: ${{ vars.ENABLE_SITEGROUND_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out deployment diagnostics
        uses: actions/checkout@v4

      - name: Download versioned ZIP
        uses: actions/download-artifact@v4
        with:
          name: siteground-${{ github.sha }}
          path: packages

      - name: Unpack site files
        run: unzip -q "packages/Sample-School-${{ needs.package.outputs.release_id }}.zip" -d siteground

      - name: Check SiteGround destination settings
        env:
          FTP_SERVER: ${{ secrets.SAMPLE_SG_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.SAMPLE_SG_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.SAMPLE_SG_FTP_PASSWORD }}
          FTP_DIR: ${{ vars.SAMPLE_SG_FTP_DIR }}
        run: |
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" && test -n "$FTP_DIR"
          [[ "$FTP_DIR" == */ ]] || { echo "Sample remote directory must end with /"; exit 1; }

      - name: Resolve verified school document root
        id: destination
        env:
          FTP_SERVER: ${{ secrets.SAMPLE_SG_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.SAMPLE_SG_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.SAMPLE_SG_FTP_PASSWORD }}
          FTP_DIR: ${{ vars.SAMPLE_SG_FTP_DIR }}
          FTP_PORT: ${{ vars.SITEGROUND_FTP_PORT || '21' }}
          SCHOOL_SLUG: sample
        run: python3 scripts/siteground-destination.py

      - name: Upload to SiteGround over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SAMPLE_SG_FTP_SERVER }}
          username: ${{ secrets.SAMPLE_SG_FTP_USERNAME }}
          password: ${{ secrets.SAMPLE_SG_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ vars.SITEGROUND_FTP_PORT || '21' }}
          security: strict
          local-dir: siteground/
          server-dir: ${{ steps.destination.outputs.dir }}

  deploy-chs:
    name: Deploy Cherry Hill
    needs: [package, deploy-backend]
    if: ${{ vars.ENABLE_SITEGROUND_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out deployment diagnostics
        uses: actions/checkout@v4

      - name: Download versioned ZIP
        uses: actions/download-artifact@v4
        with:
          name: siteground-${{ github.sha }}
          path: packages

      - name: Unpack site files
        run: unzip -q "packages/Cherry-Hill-${{ needs.package.outputs.release_id }}.zip" -d siteground

      - name: Check SiteGround destination settings
        env:
          FTP_SERVER: ${{ secrets.CHS_SG_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.CHS_SG_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.CHS_SG_FTP_PASSWORD }}
          FTP_DIR: ${{ vars.CHS_SG_FTP_DIR }}
        run: |
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" && test -n "$FTP_DIR"
          [[ "$FTP_DIR" == */ ]] || { echo "CHS remote directory must end with /"; exit 1; }

      - name: Resolve verified school document root
        id: destination
        env:
          FTP_SERVER: ${{ secrets.CHS_SG_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.CHS_SG_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.CHS_SG_FTP_PASSWORD }}
          FTP_DIR: ${{ vars.CHS_SG_FTP_DIR }}
          FTP_PORT: ${{ vars.SITEGROUND_FTP_PORT || '21' }}
          SCHOOL_SLUG: chs
        run: python3 scripts/siteground-destination.py

      - name: Upload to SiteGround over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CHS_SG_FTP_SERVER }}
          username: ${{ secrets.CHS_SG_FTP_USERNAME }}
          password: ${{ secrets.CHS_SG_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ vars.SITEGROUND_FTP_PORT || '21' }}
          security: strict
          local-dir: siteground/
          server-dir: ${{ steps.destination.outputs.dir }}

